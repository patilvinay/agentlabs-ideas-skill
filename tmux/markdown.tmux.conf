# claude-voice: the session, rendered in a browser.
# Sourced by install.sh into ~/.tmux.conf. Needs bin/ on PATH.
#
# There used to be terminal renderers here too (frogmouth in a floating pane,
# glow+chafa for images). The browser does all of it better -- real SVG,
# selectable text, proper tables -- so they were removed rather than kept as a
# second thing to maintain.
bind-key w run-shell -b "~/.local/bin/md-web '#{pane_id}'"
bind-key W choose-tree -Zw
